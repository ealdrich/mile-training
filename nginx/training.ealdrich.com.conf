# Nginx config for training.ealdrich.com
# With Cloudflare Tunnel you may not need nginx at all for a single app —
# point the tunnel directly at localhost:3001. Use this if you want nginx
# as a local reverse proxy (e.g. to host multiple sites).

server {
    listen 80;
    server_name training.ealdrich.com;

    # Security headers (Cloudflare handles HTTPS)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

